# A conservative infrastructure diagnostic, not a final training configuration.
[rental]
provider = "Runpod"
tier = "Secure Cloud"
target_gpu = "NVIDIA GeForce RTX 3090"
minimum_vram_gib = 24
recorded_hourly_gpu_price_usd = 0.46
price_checked_on = "2026-07-14"

[workload]
sequence_length = 512
micro_batch_size = 2
optimization_steps = 3
gradient_accumulation_steps = 1
gradient_checkpointing = false

[acceptance]
require_bfloat16 = true
maximum_reserved_vram_fraction = 0.80

[output]
adapter_path = "artifacts/diagnostics/gpu-feasibility-adapter"
report_path = "artifacts/diagnostics/gpu-feasibility-report.json"
